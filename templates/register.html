{% extends "base.html" %}

{% block title %}
Register | AeroNova AI
{% endblock %}


{% block content %}

<div class="container">

    <div class="auth-card">

        <h2 class="text-center mb-4">

            Create Account

        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100">

                Create Account

            </button>

        </form>

    </div>

</div>

{% endblock %}
